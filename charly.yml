# Makes this plugin repo a PROJECT so its own candy is actually gated.
#
# Without a root charly.yml the repo is "project-less": charly scans NO candies at all,
# so `charly box validate` at the repo root exits 0 on ANY manifest, including one with
# a malformed `plugin.providers` entry. The stock candy CI step asserted nothing.
# See opencharly/charly#459.
#
# Declaring discover: is the whole fix: the candy is scanned, the CUE schema gate
# applies, and the STOCK `charly box validate` step starts working with no workflow
# change. Besides telling charly where to look, this file's ONLY own declarations are
# the corpus R10 bed below (`marketplace-app` + `check-marketplace`).
defaults:
    platform:
        - linux/amd64
    tag: auto
    registry: ghcr.io/opencharly
    build:
        - rpm
    merge:
        auto: false
        max_mb: 128
discover:
    - path: candy
      recursive: true

# =============================================================================
# marketplace-app + check-marketplace — the R10 bed for the published
# marketplace corpus. Moved here from opencharly/charly's charly.yml, which
# cannot exercise this candy as in-development code (the bed's dev-tree override
# resolves the bed project's own superproject, not the candy owner), so the
# artifact owner tests its own candy locally.
#
# The bed builds a minimal box composing the LOCAL plugin-marketplace candy
# (discovered from candy/ above), whose plan: clones the PUBLISHED
# opencharly/marketplace repo at the immutable MARKETPLACE_REF and gates its
# SHAPE. The distro tag chain is load-bearing (the docs-site-app precedent): the
# package resolver walks the IMAGE's declared chain most-specific-first, so a box
# that declares `base:` alone matches no per-distro section and silently installs
# nothing.
# =============================================================================
marketplace-app:
    candy:
        base: quay.io/fedora/fedora:43
        description: |-
            The marketplace-corpus box: a minimal Fedora base composing the local
            plugin-marketplace candy, whose plan: clones the published
            opencharly/marketplace repo at the pinned MARKETPLACE_REF and gates its
            shape (catalogs, manifests, baked headers). The checks run in BOTH
            contexts, so `charly check box marketplace-app` proves the published
            corpus shape without deploying anything, and `charly check live`
            re-proves it against the running pod.
        distro:
            - fedora:43
            - fedora
        candy:
            - plugin-marketplace
check-marketplace:
    pod:
        image: marketplace-app
        disposable: true
        lifecycle: dev
        description: >-
            R10 bed for the published marketplace corpus. Building the marketplace-app box ran the plugin-marketplace candy's plan: — the clone at the pinned MARKETPLACE_REF plus the shape gates (catalogs, no-version manifests, baked skill headers, executable pinned-commit check); deploying the pod to steady state proves the box builds, starts, and stays up. The generator's fail-closed drift gate + the Go coverage are covered by the plugin's Go tests and the marketplace repo's own deploy workflow; this bed covers the published artifact those produce.
        plan:
            - check: the marketplace-app pod reached steady state (the corpus-gating box runs)
              id: marketplace-pod-running
              exit_status: 0
              stdout:
                - contains: '"kind": "pod"'
                - contains: check-marketplace
              context:
                - runtime
              command:
                command: ${CHARLY_BIN} status --json
                in_container: false
            - check: the published marketplace clone is present in the running pod
              id: marketplace-clone-present
              exit_status: 0
              stdout:
                - contains: charly-plugins
              context:
                - runtime
              command: cat /srv/marketplace/.claude-plugin/marketplace.json

# =============================================================================
# THE TWO MAINTENANCE RECIPES THIS REPO'S OWN DOCS ALREADY DESCRIBE
#
# Seven places name `charly task skills:drift` and `charly task marketplace:pin`
# and neither existed -- `charly task list` printed "no tasks declared".  This
# declares them, because the side that holds the INTENT is the documents: the
# first is named as this repository's gate for a generator change, and a gate
# that does not exist is worse than no gate, because the docs teach a reader to
# trust it.
#
# An entity is a named node whose KIND is a discriminator nested under the name
# (`marketplace-app:` carries `candy:`).  A task's discriminator is `task:`, and
# its body is the base `#Task` from the spec module, whose `plan:` reuses the SAME
# `#Step` grammar a candy's `plan:` does.
# =============================================================================

skills:drift:
    task:
        description: |-
            BOTH halves of this repository's drift gate, in one recipe, because the
            command alone is silent on the half that bites a generator change.

            `charly marketplace drift` regenerates in memory and compares with the
            artifacts ON DISK -- the corpus under --out -- and NEVER consults git,
            by design.  So it proves "regeneration is a no-op" and says nothing about
            whether the tree is committed; a generator run that emits an untracked
            file passes it.  The second step is that missing half.

            The command names the provider word directly -- `charly marketplace
            drift` -- and NOT the ${CHARLY_BIN} placeholder this repo's box and bed
            steps use.  That placeholder is supplied by a build or deploy context,
            and a standalone task has neither, so the engine reports it as an
            UNRESOLVED VARIABLE and SKIPS the step.  Measured, twice: a skip is not a
            failure, so a gate written that way would be silently vacuous -- it would
            report one step failed rather than two, and never say why.  A task's
            command must work with the charly binary alone, which is also what
            /charly-build:docs calls the binary-only-reader rule.

            ONE parameter names the CORPUS checkout, and it is UPPER-CASE: the
            runner's expansion grammar matches upper-case names only
            (`sdk/kit/checkvars_expand.go`), so a lower-case param never reaches the
            command -- the shell drops the empty word and the CLI loses the flag's
            value ("--out: expected string value but got EOL").  The parameter is
            the corpus checkout and it is BOTH --root and --out: the generator's ONE
            generation input -- the refs list, `candy/charly-marketplace/charly.yml`
            -- lives in that checkout, so --root must name it, and --out compares
            the regeneration against it.  A caller points the gate at a checkout
            with `--param CORPUS=<path>`; the default names the usual relative
            path.

            The second step checks the CORPUS tree's committed state, because that
            is where the artifacts live: a corpus file that is generated but
            untracked passes `drift` -- the bytes on disk match -- and is lost on
            the next clone.

            Neither step carries `context:`: a task's steps run in-context by
            construction (the task grammar reports every step in-context), and with
            no runtime placeholder in either command there is nothing for a context
            to resolve.

            The drift step declares a `timeout:`, and it is not decoration.  The
            per-step never-hang bound is 1m30s, and the drift resolves EVERY corpus
            source (the refs list names ~1200 repos at pinned versions) before it
            compares a single byte: measured 11m48s in the marketplace repo's own
            deploy workflow, ~12m locally.  Without the declared timeout the step
            is killed at the ceiling -- "probe killed by never-hang ceiling after
            1m30.001s" -- and the gate reports a TIMEOUT where the truth is "slow,
            and green".  The bound is a hang guard, not a budget.
        params:
            CORPUS:
                description: Marketplace corpus checkout the gate compares against -- the generator's --root AND its --out (the opencharly/marketplace checkout)
                default: ../marketplace
        timeout: "2100s"
        plan:
            - check: regeneration is a no-op against the on-disk artifacts
              id: drift-noop
              timeout: "1800s"
              command:
                command: charly marketplace drift --root "${CORPUS}" --out "${CORPUS}"
                in_container: false
            - check: the corpus tree is committed -- the half `drift` cannot see
              id: tree-committed
              command:
                command: test -z "$(git -C "${CORPUS}" status --porcelain)"
                in_container: false

marketplace:pin:
    task:
        description: |-
            Assert that `var: MARKETPLACE_REF` is an IMMUTABLE COMMIT equal to the
            opencharly/marketplace repo's CURRENT `main` head, in BOTH places it
            appears.

            AGENTS.md says the sha "is duplicated as a literal in the check step by
            design" -- so a pin that is stale in one place and current in the other
            is exactly the drift this recipe exists to catch.  Both occurrences are
            asserted against the same live head, which is why it is one task and not
            two greps.

            Each occurrence is found by its ANCHOR -- the `MARKETPLACE_REF:` key and
            the `contains:` line -- and not by POSITION in the file.  A positional
            grep is wrong here: the candy's file carries a third 40-hex string (the
            sha256 of the byte-identical SKILL.md it copies), so a "last 40-hex
            match" is that sha256 and the second step could never be true.  The
            anchors name the two pins and cannot be satisfied by a third string.
        plan:
            - check: the declared MARKETPLACE_REF var equals the marketplace repo's current main head
              id: pin-var-current
              command:
                command: 'test "$(git ls-remote https://github.com/opencharly/marketplace.git refs/heads/main | cut -f1)" = "$(grep -m 1 -oE ''MARKETPLACE_REF: [0-9a-f]{40}'' candy/plugin-marketplace/charly.yml | grep -m 1 -oE ''[0-9a-f]{40}'')"'
                in_container: false
            - check: the duplicated literal in the check step equals the same head
              id: pin-literal-current
              command:
                command: 'test "$(git ls-remote https://github.com/opencharly/marketplace.git refs/heads/main | cut -f1)" = "$(grep -m 1 -oE ''contains: [0-9a-f]{40}'' candy/plugin-marketplace/charly.yml | grep -m 1 -oE ''[0-9a-f]{40}'')"'
                in_container: false
